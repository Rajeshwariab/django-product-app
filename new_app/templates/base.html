{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

<title>Django Product App</title>

<!-- Bootstrap CSS -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="{% static 'images/myicon.ico' %}">
<link rel="shortcut icon" href="{% static 'images/myicon.ico' %}">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container-fluid">

<a class="navbar-brand" href="/">MyProject</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="navbarNav">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="/">Home</a>
</li>

<li class="nav-item">
<a class="nav-link" href="{% url 'product_list' %}">Products</a>
</li>

<li class="nav-item">
<a class="nav-link" href="{% url 'add_product' %}">Add Product</a>
</li>

{% if user.is_authenticated %}

<li class="nav-item">
<a class="nav-link" href="{% url 'logout' %}">Logout</a>
</li>

{% else %}

<li class="nav-item">
<a class="nav-link" href="{% url 'login' %}">Login</a>
</li>

<li class="nav-item">
<a class="nav-link" href="{% url 'register' %}">Register</a>
</li>

{% endif %}

</ul>

</div>
</div>
</nav>

<div class="container mt-4">

{% block content %}

{% endblock %}

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
